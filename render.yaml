services:
  # Backend API - Otimizado para deploy rápido
  - type: web
    name: gurudodindin-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && cd packages/backend && npm run build
    startCommand: cd packages/backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: OPEN_BANKING_PROVIDER
        value: pluggy
      # Segredos NÃO ficam no arquivo. Configure no painel do Render
      # (Environment) — sync:false faz o Render solicitar/preservar o valor.
      - key: PLUGGY_CLIENT_ID
        sync: false
      - key: PLUGGY_CLIENT_SECRET
        sync: false
      - key: PLUGGY_BASE_URL
        value: https://api.pluggy.ai
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://gurudodindin.com.br
      - key: OPEN_BANKING_REDIRECT_URI
        value: https://gurudodindin.com.br/bank/callback
      - key: SUPABASE_URL
        value: https://bhkvenyaxkkqzcsfyjvb.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoa3ZlbnlheGtrcXpjc2Z5anZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI3MTI0MzEsImV4cCI6MjA3ODI4ODQzMX0.IYDBpAbEF4VHzPmq_xEtlH1TnOk5o2Zp1eoleXao3po
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
